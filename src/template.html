<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <title>Homepage - Portfolio</title>
  </head>
  <body>
    <header>
      <div class="header-background"></div>
      <div class="header-content">
        <div class="profile-pic-container">
          <img
            src="./ramenTest.jpg"
            alt="Profile Picture"
            class="profile-pic"
          />
          <p class="profile-name">Ramen Food</p>
        </div>
        <div class="about-me-container">
          <h1>About Me</h1>
          <p class="about-me">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Harum
            obcaecati dolor vel veniam praesentium maxime quam corrupti ut
            perspiciatis, voluptatum eius mollitia minus non inventore ea fuga?
            Atque, quisquam nihil.
          </p>
          <div class="about-me-links">
            <button class="github-btn">
              <i class="fa-brands fa-github"></i>
            </button>
            <button class="linkedin-btn">
              <i class="fa-brands fa-linkedin"></i>
            </button>
            <button class="itchio-btn">
              <i class="fa-brands fa-itch-io"></i>
            </button>
          </div>
        </div>

    </header>
    <main></main>
    <footer></footer>
